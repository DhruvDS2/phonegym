[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonegym"
version = "0.0.1"
description = "Simulated phone environment and eval harness for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/phonegym"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
